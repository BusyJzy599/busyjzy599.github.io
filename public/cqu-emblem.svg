<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Chongqing University emblem</title>
  <desc id="desc">A blue and white circular Chongqing University emblem with the founding year 1929.</desc>
  <defs>
    <path id="top-arc" d="M15 48a35 35 0 0 1 70 0"/>
    <path id="bottom-arc" d="M16 56a34 34 0 0 0 68 0"/>
  </defs>
  <circle cx="50" cy="50" r="47" fill="#fff" stroke="#1768aa" stroke-width="3"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#1768aa" stroke-width="1.5"/>
  <g fill="#1768aa" font-family="Noto Serif SC, STSong, Songti SC, serif" text-anchor="middle">
    <text font-size="9" letter-spacing="3"><textPath href="#top-arc" startOffset="50%">重庆大学</textPath></text>
    <text font-family="Georgia,serif" font-size="5.2" letter-spacing=".55"><textPath href="#bottom-arc" startOffset="50%">CHONGQING UNIVERSITY</textPath></text>
